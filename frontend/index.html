<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Machine Translation</title>
</head>
<body>
  <div style="max-width:600px;margin:24px auto;border:1px solid #ddd;border-radius:8px;padding:16px;font-family:sans-serif;">
    <h1 style="margin-top:0;">Machine Translation</h1>
    <label for="src">Source Text</label><br>
    <textarea id="src" style="width:100%;min-height:100px;background:#eef2f7;border:1px solid #ddd;border-radius:4px;"></textarea><br>
    <button id="btn" style="margin-top:8px;padding:6px 12px;">Translate</button>
    <div style="margin-top:16px;">
      <label for="dst">Translation</label><br>
      <div id="dst" style="width:100%;min-height:60px;background:#f9f9fb;border:1px solid #ddd;border-radius:4px;padding:6px;"></div>
    </div>
  </div>

  <script>
    const API_URL = "http://localhost:8000/translate"; // URL de ton API

    async function callAPI(text){
      const res = await fetch(API_URL, {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ text })
      });
      if (!res.ok) { throw new Error("Error: " + res.status); }
      return res.json();
    }

    document.getElementById("btn").addEventListener("click", async () => {
      const src = document.getElementById("src");
      const dst = document.getElementById("dst");
      dst.textContent = "";
      const value = src.value.trim();
      if (!value) return;
      try {
        const data = await callAPI(value);
        const out = Array.isArray(data.translations) ? data.translations.join("\n") : data.translations;
        dst.textContent = out;
      } catch (e) {
        dst.textContent = e.message;
      }
    });
  </script>
</body>
</html>
